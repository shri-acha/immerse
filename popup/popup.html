<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamang Immersion</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="widget-container">
    <header>
      <h1>TAMANG</h1>
    </header>

    <div class="control-group">
      <div class="flex-between">
        <label for="baseLanguage" class="control-label">BASE LANGUAGE</label>
        <select id="baseLanguage" class="flat-select">
          <option value="en">English</option>
          <option value="de">German</option>
          <option value="fr">French</option>
          <option value="zh-CN">Chinese</option>
        </select>
      </div>
    </div>

    <div class="control-group">
      <div class="flex-between">
        <label for="learningMode" class="control-label">IMMERSION MODE</label>
        <label class="switch">
          <input type="checkbox" id="learningMode">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="control-group">
      <div class="flex-between">
        <label for="difficultyLevel" class="control-label">DIFFICULTY</label>
        <span id="diffValue" class="value-badge">1</span>
      </div>
      <input type="range" id="difficultyLevel" min="1" max="4" value="1" class="flat-slider">
      <p class="desc" id="difficultyDesc">Translates a few words.</p>
    </div>

    <button id="viewGraphBtn" class="flat-btn">OPEN GRAPH VIEW</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
