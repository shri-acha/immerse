<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamang Knowledge Graph</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <canvas id="graphCanvas"></canvas>
  
  <div id="wordDetail" class="word-detail" style="display: none;">
    <div class="word-detail-header">
      <h2 id="detailWord"></h2>
      <span id="detailPos" class="pos-tag"></span>
      <button id="closeDetail" class="close-btn">&times;</button>
    </div>
    <div id="detailFreq" class="detail-freq"></div>
    <div id="detailDefs" class="detail-defs"></div>
  </div>
  
  <script src="options.js"></script>
</body>

</html>
