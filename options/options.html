<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamang Knowledge Graph</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <div class="overlay">
    <h1>Vocabulary Graph</h1>
    <p>Words you've learned through Tamang Immersion.</p>
    <div class="stats">
      <span>Total Unique Words: <strong id="uniqueWords">0</strong></span>
    </div>
    
    <div class="graph-controls">
      <label for="graphLang">Show Graph in:</label>
      <select id="graphLang" class="lang-select">
        <option value="en">English (Original)</option>
        <option value="ne">Nepali</option>
        <option value="tmg">Tamang</option>
      </select>
    </div>
    
    <div class="export-controls">
      <button id="exportJSON" class="export-btn">Export JSON</button>
      <button id="exportCSV" class="export-btn">Export CSV</button>
    </div>

    <div class="quiz-metrics-panel">
      <h3>Quiz Performance</h3>
      <div class="metrics-row">
        <canvas id="donutChart" width="80" height="80"></canvas>
        <div class="metrics-numbers">
          <div class="metric-item metric-correct">
            <span class="metric-dot"></span>
            <span class="metric-label">Correct</span>
            <span class="metric-val" id="graphCorrect">0</span>
          </div>
          <div class="metric-item metric-wrong">
            <span class="metric-dot"></span>
            <span class="metric-label">Wrong</span>
            <span class="metric-val" id="graphWrong">0</span>
          </div>
          <div class="metric-item metric-hinted">
            <span class="metric-dot"></span>
            <span class="metric-label">Hinted</span>
            <span class="metric-val" id="graphHinted">0</span>
          </div>
        </div>
      </div>
      <div class="node-legend">
        <span class="legend-title">Node Colors:</span>
        <span class="legend-item"><span class="legend-swatch" style="background:#4ade80;"></span>Mastered</span>
        <span class="legend-item"><span class="legend-swatch" style="background:#fbbf24;"></span>Needs Practice</span>
        <span class="legend-item"><span class="legend-swatch" style="background:#f87171;"></span>Weak</span>
        <span class="legend-item"><span class="legend-swatch" style="background:#60a5fa;"></span>Untested</span>
      </div>
    </div>
  </div>
  <canvas id="graphCanvas"></canvas>
  
  <div id="wordDetail" class="word-detail" style="display: none;">
    <div class="word-detail-header">
      <h2 id="detailWord"></h2>
      <span id="detailPos" class="pos-tag"></span>
      <button id="closeDetail" class="close-btn">&times;</button>
    </div>
    <div id="detailFreq" class="detail-freq"></div>
    <div id="detailDefs" class="detail-defs"></div>
  </div>
  
  <script src="options.js"></script>
</body>

</html>
