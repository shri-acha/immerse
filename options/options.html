<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamang Knowledge Graph</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <div class="overlay">
    <h1>Vocabulary Graph</h1>
    <p>Words you've learned through Tamang Immersion.</p>
    <div class="stats">
      <span>Total Unique Words: <strong id="uniqueWords">0</strong></span>
    </div>
    
    <div class="graph-controls">
      <label for="graphLang">Show Graph in:</label>
      <select id="graphLang" class="lang-select">
        <option value="en">English (Original)</option>
        <option value="ne">Nepali</option>
        <option value="tmg">Tamang</option>
      </select>
    </div>
  </div>
  <canvas id="graphCanvas"></canvas>
  
  <div id="wordDetail" class="word-detail" style="display: none;">
    <div class="word-detail-header">
      <h2 id="detailWord"></h2>
      <span id="detailPos" class="pos-tag"></span>
      <button id="closeDetail" class="close-btn">&times;</button>
    </div>
    <div id="detailFreq" class="detail-freq"></div>
    <div id="detailDefs" class="detail-defs"></div>
  </div>
  
  <script src="options.js"></script>
</body>

</html>
